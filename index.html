<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سبزکود | فروشگاه کود کشاورزی</title>
<meta name="description" content="معرفی محصولات کود کشاورزی سبزکود">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5faf6;color:#24352b;line-height:1.9}
header{background:#1b4332;color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:5px 0 0}
nav{background:#fff;padding:13px;text-align:center;box-shadow:0 2px 10px #0001}
nav a{color:#2d6a4f;text-decoration:none;margin:0 12px;font-weight:bold}
.hero{padding:45px 18px;text-align:center;background:linear-gradient(135deg,#1b4332,#40916c);color:white}
.hero h2{font-size:28px;margin:0 0 12px}
.hero p{margin:0}
main{max-width:1100px;margin:auto;padding:30px 16px}
h2.section-title{text-align:center;color:#1b4332}
#products-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 4px 18px #1b433214}
.product-image{height:180px;background:#d8f3dc;display:flex;align-items:center;justify-content:center;font-size:55px}
.product-image img{width:100%;height:100%;object-fit:cover}
.details{padding:18px}
.details h3{margin:0 0 8px;color:#1b4332}
.description{color:#59675e;font-size:14px}
.price{font-weight:bold;color:#2d6a4f}
.message{background:white;padding:22px;text-align:center;border-radius:12px;grid-column:1/-1}
footer{background:#1b4332;color:white;text-align:center;padding:24px;margin-top:35px}
</style>
</head>
<body>
<header>
<h1>🌱 سبزکود</h1>
<p>فروشگاه و معرفی کودهای کشاورزی</p>
</header>

<nav>
<a href="#home">خانه</a>
<a href="#products">محصولات</a>
<a href="#contact">تماس</a>
</nav>

<section class="hero" id="home">
<h2>به سبزکود خوش آمدید</h2>
<p>معرفی محصولات برای رشد بهتر و سالم‌تر گیاهان شما</p>
</section>

<main>
<section id="products">
<h2 class="section-title">🌿 محصولات سبزکود</h2>
<div id="products-grid">
<div class="message">در حال بارگذاری محصولات…</div>
</div>
</section>

<section id="contact">
<h2 class="section-title">تماس با سبزکود</h2>
<p style="text-align:center">اطلاعات تماس فروشگاه به‌زودی اضافه می‌شود.</p>
</section>
</main>

<footer>© <span id="year"></span> سبزکود</footer>

<script>
document.getElementById("year").textContent =
  new Date().getFullYear();

const grid = document.getElementById("products-grid");

function showMessage(message) {
  grid.replaceChildren();
  const box = document.createElement("div");
  box.className = "message";
  box.textContent = message;
  grid.appendChild(box);
}

function firstValue(obj, keys) {
  for (const key of keys) {
    if (obj[key] !== undefined &&
        obj[key] !== null &&
        String(obj[key]).trim() !== "") {
      return obj[key];
    }
  }
  return "";
}

function showProduct(product) {
  const name = firstValue(product, [
    "name", "title", "product_name", "نام"
  ]);
  if (!name) return false;

  const card = document.createElement("article");
  card.className = "card";

  const imageBox = document.createElement("div");
  imageBox.className = "product-image";

  const imageUrl = firstValue(product, [
    "image", "image_url", "photo", "photo_url", "thumbnail"
  ]);

  if (imageUrl) {
    const img = document.createElement("img");
    img.src = imageUrl;
    img.alt = name;
    img.onerror = () => {
      imageBox.replaceChildren();
      imageBox.textContent = "🌱";
    };
    imageBox.appendChild(img);
  } else {
    imageBox.textContent = "🌱";
  }

  const details = document.createElement("div");
  details.className = "details";

  const title = document.createElement("h3");
  title.textContent = name;
  details.appendChild(title);

  const description = firstValue(product, [
    "description", "desc", "details", "توضیحات", "مشخصات"
  ]);

  if (description) {
    const p = document.createElement("p");
    p.className = "description";
    p.textContent = description;
    details.appendChild(p);
  }

  const price = firstValue(product, ["price", "cost", "قیمت"]);

  if (price !== "") {
    const p = document.createElement("p");
    p.className = "price";
    p.textContent = "قیمت: " + price +
      (product.currency ? " " + product.currency : "");
    details.appendChild(p);
  }

  card.append(imageBox, details);
  grid.appendChild(card);
  return true;
}

async function loadProducts() {
  showMessage("در حال بارگذاری محصولات…");

  try {
    const api =
      "https://api.github.com/repos/a13912020/fertilizer-store/contents/products?ref=main";

    const response = await fetch(api, {
      headers: { Accept: "application/vnd.github+json" }
    });

    if (!response.ok) {
      throw new Error("دریافت فهرست محصولات ناموفق بود (" +
        response.status + ")");
    }

    const files = await response.json();

    if (!Array.isArray(files)) {
      throw new Error("پوشه محصولات قابل خواندن نیست.");
    }

    const jsonFiles = files.filter(file =>
      file.type === "file" &&
      file.name.toLowerCase().endsWith(".json")
    );

    if (jsonFiles.length === 0) {
      showMessage("هنوز محصولی ثبت نشده است.");
      return;
    }

    grid.replaceChildren();
    let count = 0;

    for (const file of jsonFiles) {
      try {
        const result = await fetch(file.download_url);
        if (!result.ok) continue;

        const product = await result.json();

        if (product.published === false ||
            product.active === false) continue;

        if (showProduct(product)) count++;
      } catch (error) {
        console.error("خطا در خواندن فایل محصول:", file.name, error);
      }
    }

    if (count === 0) {
      showMessage("فایل‌ها پیدا شدند، اما محصول قابل نمایش نبود. نام محصول را در فایل JSON بررسی کنید.");
    }

  } catch (error) {
    console.error("خطای بارگذاری محصولات:", error);
    showMessage(
      "بارگذاری محصولات انجام نشد. اینترنت را بررسی کنید و صفحه را دوباره باز کنید. اگر مشکل باقی ماند، باید اتصال به گیت‌هاب بررسی شود."
    );
  }
}

loadProducts();
</script>
</body>
</html>
